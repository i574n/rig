[package.metadata.kit]
developer-tool = true

[package.metadata.spiral]
entry = "main.spi"
output = "dev.rs"

[[package.metadata.spiral.auxiliary]]
entry = "selected_tests.spi"
output = "selected_tests.rs"

[[test]]
name = "selected_workflow"
path = "selected_tests.rs"

[package]
name = "rig-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kit-dev"
path = "dev.rs"

[dependencies]
rig-process = { path = "../rig_process" }
predicate-lex-domain = { path = "../predicate_lex_domain" }
predicate-literal-domain = { path = "../predicate_literal_domain" }
developer-metadata-domain = { path = "../developer_metadata_domain" }
rig-dev-spiral-tests = { path = "../rig_dev_spiral_tests" }

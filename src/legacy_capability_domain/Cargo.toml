[package.metadata.spiral]
entry = "main.spi"
output = "legacy_surface.rs"

[package]
name = "legacy-capability-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "legacy_surface.rs"

[dependencies]
rig-process-observation = { path = "../rig_process_observation" }
rig-rust-std-fs = { path = "../rust_std_fs" }
rig-rust-std-fs-mutation = { path = "../rust_std_fs_mutation" }
rig-tree-copy = { path = "../rig_tree_copy" }

[lints.clippy]
needless_return = "allow"
needless_late_init = "allow"

[package.metadata.spiral]
entry = "bundle_manifest.spi"
output = "bundle_manifest.rs"

[package]
name = "rig-bundle-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rig_bundle_manifest"
path = "bundle_manifest.rs"

[dependencies]
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
archive-deflate-domain = { path = "../archive_deflate_domain" }
rig-rust-std-fs-mutation = { path = "../rust_std_fs_mutation" }
rig-archive-tar-runtime = { path = "../rig_archive_tar_runtime" }
rig-process-observation = { path = "../rig_process_observation" }

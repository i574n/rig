[package.metadata.spiral]
entry = "main.spi"
output = "tree_copy.rs"

[package]
name = "rig-tree-copy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "tree_copy.rs"

[dependencies]
rig-rust-std-fs = { path = "../rust_std_fs" }
rig-rust-std-fs-mutation = { path = "../rust_std_fs_mutation" }

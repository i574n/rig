[package.metadata.spiral]
entry = "main.spi"
output = "hygiene.rs"

[[package.metadata.spiral.auxiliary]]
entry = "hygiene_policy_probe/main.spi"
output = "hygiene_policy_probe/hygiene_policy_probe.rs"

[package]
name = "rig-release-hygiene"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rig_release_hygiene"
path = "hygiene.rs"

[dependencies]
legacy-capability-domain = { path = "../legacy_capability_domain" }
rig-proxy-search = { path = "../rig_proxy_search" }
rig-rust-std-fs = { path = "../rust_std_fs" }

[[example]]
name = "hygiene-policy-probe"
path = "hygiene_policy_probe/hygiene_policy_probe.rs"
test = false

[package.metadata.spiral]
entry = "run.spi"
output = "do_edit.rs"

[package]
name = "rig-do-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rig_do_edit"
path = "do_edit.rs"

[dependencies]
rig-do-verbs = { path = "../rig_do_verbs" }
rig-do-process = { path = "../rig_do_process" }
rig-do-commit = { path = "../rig_do_commit" }
regex = "1.13.1"
sha2 = "0.11.1"
rig-do-model = { path = "../rig_do_model" }

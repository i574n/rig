rig-lint-flow-constructs = { path = "../rig_lint_flow_constructs" }
rig-lint-flow-idioms = { path = "../rig_lint_flow_idioms" }
rig-lint-shadows = { path = "../rig_lint_shadows" }
rig-lint-args = { path = "../rig_lint_args" }

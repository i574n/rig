[package]
name = "nodebench"
version = "0.2.0"
edition = "2021"
description = "Fleet node benchmark: CPU + memory + disk (+ optional GPU/WGSL), one self-contained exe."

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
